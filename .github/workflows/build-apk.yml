
name: Extract and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GestureControl-phone-build.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q GestureControl-phone-build.zip -d extracted
          cp -a extracted/GestureControl/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
